name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config -q
          rm -f .env
      - name: Build image
        run: docker build -t jkbox-studio:ci .
      - name: Smoke test (yt-dlp + ffmpeg + healthcheck)
        run: |
          docker run --rm --entrypoint sh jkbox-studio:ci -c 'yt-dlp --version && ffmpeg -version | head -1'
          docker run -d --name jkbox -p 3000:3000 -e YTDLP_AUTO_UPDATE=false jkbox-studio:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS -o /dev/null http://127.0.0.1:3000/remote
          docker logs jkbox
